apiVersion: apps/v1
kind: deployment
metadata:
  name: kubedemoapp-deployment
  spec:
    replicas:1
    selector:
      matchLabels:
        app: kubedemoapp
    template:
      metadata:
        labels:
          app: kubedemoapp
      spec:
        containers:
        - name: kubedemoapp
          image: vaish205/sample1
          ports:
          - containerPort: 5000
